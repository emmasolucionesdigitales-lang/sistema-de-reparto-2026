  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
  <script>
    // ═══════════════════════════════════════════
    // REEMPLAZÁ ESTOS VALORES CON TU FIREBASE CONFIG
    // ═══════════════════════════════════════════
    const firebaseConfig = {
      apiKey:            "AIzaSyDV1i35MLw74hjnSg6rRZgQFIAI8hsJllI",
      authDomain:        "app-reparto-65035.firebaseapp.com",
      projectId:         "app-reparto-65035",
      storageBucket:     "app-reparto-65035.firebasestorage.app",
      messagingSenderId: "162304851374",
      appId:             "1:162304851374:web:0a60847807c8fe9a7a1c3f"
    };
    firebase.initializeApp(firebaseConfig);
    // ── Autenticación anónima — necesaria para las reglas de Firestore ──
    // window.auth guarda la sesión real (uid) de este dispositivo: sirve
    // para que las reglas de seguridad sepan "este negocio es tuyo" sin
    // depender del código de licencia (que cualquiera podría escribir a mano).
    window.auth = firebase.auth();
    window.auth.signInAnonymously().catch(e=>console.warn("Auth anónima:", e));
    window.db = firebase.firestore();
    // enablePersistence() está deprecado por Firebase; la reemplazamos por la
    // forma nueva (FirestoreSettings.cache) para sacar el aviso de la consola,
    // con el mismo comportamiento de antes (funciona offline, con soporte
    // multi-pestaña) y sin romper nada si el SDK cargado fuera más viejo.
    try {
      window.db.settings({
        localCache: firebase.firestore.persistentLocalCache({
          tabManager: firebase.firestore.persistentMultipleTabManager()
        })
      });
    } catch (e) {
      window.db.enablePersistence().catch(()=>{});
    }
    const db = window.db;

    // Cloud Messaging — para las notificaciones push (15-app.js pide el
    // token acá adentro con window.messagingLC.getToken(...))
    try { if(firebase.messaging.isSupported()) window.messagingLC = firebase.messaging(); }
    catch(e) { console.warn("Cloud Messaging no disponible en este navegador:", e); }

    // Firebase admin (app-control-de-apps) — verifica códigos de licencia
    firebase.initializeApp({
      apiKey:            "AIzaSyAFQ4ybqIoVV3rWe1FMjMVUZ-qzLNZbdBk",
      authDomain:        "app-control-de-apps.firebaseapp.com",
      projectId:         "app-control-de-apps",
      storageBucket:     "app-control-de-apps.firebasestorage.app",
      messagingSenderId: "761424199819",
      appId:             "1:761424199819:web:513eeaf0e54f4e1401d48e"
    }, "control");
    window.dbLicencias = firebase.app("control").firestore();
    // Sesión anónima propia de este proyecto (aparte del proyecto principal) —
    // sin esto, las reglas nuevas de app-control-de-apps no dejan ni leer ni
    // activar ninguna licencia.
    window.dbLicenciasReady = new Promise(function(resolve){
      firebase.app("control").auth().onAuthStateChanged(function(u){ if(u) resolve(u.uid); });
      firebase.app("control").auth().signInAnonymously().catch(function(){ resolve(null); });
    });

    // ── Device ID permanente (para atar la licencia a este dispositivo) ──
    (function(){
      let id = localStorage.getItem("sr_device_id");
      if(!id){ id = "dev_" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("sr_device_id", id); }
    })();

    // ── Tipo de dispositivo (PC o móvil) — para el licenciamiento de 2 aparatos ──
    window.tipoDispositivoRM = function() {
      const ua = navigator.userAgent || "";
      const esMovilUA = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua);
      // iPadOS 13+ se identifica como "Macintosh" pero tiene pantalla táctil
      const esIpadDisfrazado = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
      return (esMovilUA || esIpadDisfrazado) ? "movil" : "pc";
    };

    // Arma (sin guardar todavía) el objeto {pc,movil} de una licencia, migrando
    // el esquema viejo de un solo "deviceId" la primera vez que se ve.
    window.slotsLicenciaRM = function(d, miDevice, miTipo) {
      let dispositivos = d.dispositivos;
      if(!dispositivos) {
        dispositivos = {pc:"", movil:""};
        if(d.deviceId) {
          // Si es el mismo aparato que ya tenía la licencia, asignarlo a SU tipo real.
          // Si es uno distinto pidiendo entrar, dejamos el viejo reservado en el
          // casillero contrario para no perderle el acceso a quien ya la usaba.
          dispositivos[d.deviceId === miDevice ? miTipo : (miTipo === "pc" ? "movil" : "pc")] = d.deviceId;
        }
      }
      return dispositivos;
    };

    // Verifica el código contra la base del admin y devuelve los datos
    window.verificarLicencia = async function(codigo) {
      try {
        const snap = await window.dbLicencias
          .collection("licencias")
          .doc(codigo.trim().toUpperCase())
          .get();
        if(!snap.exists) return null;
        const d = snap.data();
        // Estados que NO permiten entrar
        if(d.estado === "inactivo" || d.estado === "pendiente") return null;
        // Licencia del dueño: hasta 2 dispositivos, uno de PC y uno de móvil
        if(d.estado === "usado") {
          const miDevice = localStorage.getItem("sr_device_id");
          const miTipo = window.tipoDispositivoRM();
          const dispositivos = window.slotsLicenciaRM(d, miDevice, miTipo);
          const slotOcupado = dispositivos[miTipo];
          if(slotOcupado && slotOcupado !== miDevice) return null; // ese tipo de aparato ya está ocupado por otro
        }
        // "activo" (sin usar) o dispositivo propio dentro del cupo → OK
        return d; // incluye: pin, negocio, email, celular, nombre, deviceId, dispositivos
      } catch(e) { console.error("verificarLicencia:", e); return null; }
    };

    // ════════════════════════════════════════════════════════════════
    // Persistencia por colección — cada tipo de dato (clientes, ventas,
    // stock, etc.) vive en su propia colección/doc dentro de
    // users/{negocio}/..., en vez de un único documento gigante que se
    // reescribía ENTERO en cada guardado. Así, guardar una venta ya no
    // vuelve a subir todo el negocio — más rápido y gasta menos cuota
    // gratis de Firestore a medida que crece el negocio. El doc viejo
    // (datos/main) se deja de escribir, pero se lee UNA vez para migrar
    // solo, si un negocio todavía no tiene nada en el formato nuevo.
    // ════════════════════════════════════════════════════════════════
    const SR_LISTAS = ["clientes","ventas","productos","recordatorios","noVisitas","perdidas"];
    const SR_MAPAS  = { planillas:"planillas", stock:"stock", cargasDia:"cargasDia", zonasReparto:"zonasReparto", mantVeh:"mantVeh", histPrecios:"histPrecios" };
    const SR_CONFIG_KEYS = ["horaAvisoCierre","horasAvisoTrans","diasAvisoMant"];
    const SR_ID_FN = { noVisitas: v => `${v.clienteId}_${v.dia}_${v.fecha}` };

    function _srBase(id) { return db.collection("users").doc(id); }
    function _srItemId(key, item, idx) {
      if (item && item.id != null) return String(item.id);
      if (SR_ID_FN[key]) return String(SR_ID_FN[key](item)).replace(/\//g, "-");
      return `auto_${idx}_${(item && item._upd) || Date.now()}`;
    }
    async function _srCommit(ops) {
      for (let i = 0; i < ops.length; i += 450) {
        const batch = db.batch();
        ops.slice(i, i + 450).forEach(op => op.del ? batch.delete(op.ref) : batch.set(op.ref, op.data));
        await batch.commit();
      }
    }
    async function _srIdsActuales(col) {
      const snap = await col.get();
      return snap.docs.map(d => d.id);
    }

    // data: objeto con TODO el estado local (igual que antes). id: código
    // de negocio. opts.keys: qué claves de "data" hace falta persistir en
    // este guardado puntual (si se omite, se persiste todo — usado para
    // migración, restaurar respaldo y el reintento offline). opts.fresh:
    // lo que había en la nube en cada colección tocada, momentos antes de
    // este guardado (para poder borrar lo que ya no está sin tener que
    // releer todo de nuevo acá adentro).
    async function cloudSave(data, id, opts) {
      const safeId = (id && id !== "") ? id : "firebase";
      const base = _srBase(safeId);
      const keys = (opts && opts.keys) || [...SR_LISTAS, ...Object.keys(SR_MAPAS), "_config"];
      const fresh = (opts && opts.fresh) || null;
      try {
        let ops = [];
        for (const key of SR_LISTAS) {
          if (!keys.includes(key) || data[key] === undefined) continue;
          const col = base.collection(key);
          const arr = data[key] || [];
          const idsNuevos = new Set();
          arr.forEach((item, idx) => {
            if (item == null) return;
            const iid = _srItemId(key, item, idx);
            idsNuevos.add(iid);
            ops.push({ ref: col.doc(iid), data: item });
          });
          if (fresh && fresh[key]) {
            fresh[key].forEach((item, idx) => {
              if (item == null) return;
              const iid = _srItemId(key, item, idx);
              if (!idsNuevos.has(iid)) ops.push({ ref: col.doc(iid), del: true });
            });
          } else if (!fresh) {
            const idsCloud = await _srIdsActuales(col);
            idsCloud.forEach(iid => { if (!idsNuevos.has(iid)) ops.push({ ref: col.doc(iid), del: true }); });
          }
        }
        for (const key of Object.keys(SR_MAPAS)) {
          if (!keys.includes(key) || data[key] === undefined) continue;
          const esArraySimple = key === "mantVeh" || key === "histPrecios";
          ops.push({ ref: base.collection("meta").doc(SR_MAPAS[key]), data: esArraySimple ? { d: data[key] || [] } : (data[key] || {}) });
        }
        if (keys.includes("_config") || SR_CONFIG_KEYS.some(k => keys.includes(k))) {
          const cfg = {}; let hay = false;
          SR_CONFIG_KEYS.forEach(k => { if (data[k] !== undefined) { cfg[k] = data[k]; hay = true; } });
          if (hay) ops.push({ ref: base.collection("meta").doc("config"), data: cfg, merge: true });
        }
        await _srCommit(ops);
        return true;
      } catch(e) { console.error("cloudSave error:", e); return false; }
    }

    async function _srCargarClaves(id, keys) {
      const base = _srBase(id);
      const out = {};
      await Promise.all(keys.map(async key => {
        if (SR_LISTAS.includes(key)) {
          const snap = await base.collection(key).get();
          out[key] = snap.docs.map(d => d.data());
        } else if (SR_MAPAS[key]) {
          const doc = await base.collection("meta").doc(SR_MAPAS[key]).get();
          if (key === "mantVeh" || key === "histPrecios") out[key] = doc.exists ? (doc.data().d || []) : [];
          else out[key] = doc.exists ? doc.data() : {};
        }
      }));
      return out;
    }

    async function cloudLoad(id) {
      const safeId = (id && id !== "") ? id : "firebase";
      try {
        const out = await _srCargarClaves(safeId, [...SR_LISTAS, ...Object.keys(SR_MAPAS)]);
        const cfgDoc = await _srBase(safeId).collection("meta").doc("config").get();
        if (cfgDoc.exists) Object.assign(out, cfgDoc.data());

        const hayAlgoNuevo = SR_LISTAS.some(k => (out[k]||[]).length) ||
          Object.keys(out.stock||{}).length || Object.keys(out.planillas||{}).length;
        if (!hayAlgoNuevo) {
          const viejo = await _srBase(safeId).collection("datos").doc("main").get();
          if (viejo.exists) {
            const d = viejo.data();
            await cloudSave(d, safeId); // migra al formato nuevo (guardado completo, una sola vez)
            return d;
          }
        }
        return out;
      } catch(e) { console.error("cloudLoad error:", e); return null; }
    }

    // Versión parcial: solo trae las colecciones/mapas pedidos — la usa
    // syncData para no releer TODO el negocio antes de cada guardado
    // puntual (sería caro de cuota a medida que crece el negocio).
    async function cloudLoadKeys(id, keys) {
      const safeId = (id && id !== "") ? id : "firebase";
      const claves = (keys||[]).filter(k => SR_LISTAS.includes(k) || SR_MAPAS[k]);
      if (!claves.length) return {};
      try { return await _srCargarClaves(safeId, claves); }
      catch(e) { console.error("cloudLoadKeys error:", e); return null; }
    }

    // ── Email vía Google Apps Script ────────────────────────────────────
    // La clave de Brevo ya NO está acá: vive oculta en tu Apps Script.
    // 1) Pegá la URL de tu Apps Script (termina en /exec)
    // 2) Pegá el MISMO token que pusiste en el Code.gs
    const EMAIL_ENDPOINT = "https://script.google.com/macros/s/AKfycbzmNoGW8yrdtUTjGUhLym67rDfRc9-h4FtYqFWkOEojkIYnDGEy13gt1704S74YU9xj/exec";
    const EMAIL_TOKEN    = "Emma131017";

    window.enviarEmailBrevoRM = async function({to, toName, subject, htmlContent}) {
      // OJO: sin header Content-Type a propósito — evita el "preflight" CORS
      // que Apps Script no soporta. No lo agregues.
      const resp = await fetch(EMAIL_ENDPOINT, {
        method: "POST",
        body: JSON.stringify({ token: EMAIL_TOKEN, to, toName, subject, htmlContent })
      });
      const data = await resp.json().catch(()=>({ ok:false, error:"respuesta inválida del servicio" }));
      if(!data.ok) throw new Error(data.error || "Error al enviar email");
      return true;
    };
  </script>

  <!-- ════ Notificaciones push ════ -->
  <script>
  (function(){
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
    if(!('PushManager' in window) || !('Notification' in window)) return;

    var VAPID_PUB_KEY = 'BFXBrNy6Xca3ejWylkF-sZ9_pZQzZNMjDbInqlsPzn1oF3F8EDnDOBLqt8fEZs-g_-HJCIJRZ3-dd0yiQECcHpk';
    function urlB64ToUint8(b){
      var p = '='.repeat((4 - b.length % 4) % 4);
      var s = (b + p).replace(/-/g,'+').replace(/_/g,'/');
      var r = atob(s); var o = new Uint8Array(r.length);
      for(var i=0;i<r.length;i++) o[i]=r.charCodeAt(i); return o;
    }
    function idActual(){ return window._negocioId || 'firebase'; }
    function deviceIdActual(){ return localStorage.getItem("sr_device_id") || "unknown"; }
    async function guardarSub(sub){
      if(!window.db) return;
      var id = idActual();
      var deviceId = deviceIdActual();
      // Se guarda bajo la clave de ESTE dispositivo — no pisa la suscripción
      // de otro celu/PC que use el mismo negocio.
      var payload = {};
      payload[deviceId] = { sub: JSON.stringify(sub), ts: Date.now() };
      await window.db.collection('users').doc(id).collection('datos').doc('push_subs').set(payload, { merge:true });
    }
    async function activarNotif(){
      var p = await Notification.requestPermission();
      if(p !== 'granted'){ alert('Para recibir avisos tenés que permitir las notificaciones.'); return false; }
      var reg = await navigator.serviceWorker.ready;
      var subVieja = await reg.pushManager.getSubscription();
      if(subVieja){ try{ await subVieja.unsubscribe(); }catch(e){} } // siempre limpio, evita quedar con endpoint viejo
      var sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlB64ToUint8(VAPID_PUB_KEY) });
      await guardarSub(sub);
      return true;
    }
    async function desactivarNotif(){
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      if(sub) await sub.unsubscribe();
      if(window.db){
        var deviceId = deviceIdActual();
        var upd = {};
        upd[deviceId] = firebase.firestore.FieldValue.delete();
        try{ await window.db.collection('users').doc(idActual()).collection('datos').doc('push_subs').update(upd); }catch(e){}
      }
    }
    async function estadoNotif(){
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      return !!sub;
    }
    // El activar/desactivar/estado ahora se maneja desde Configuración
    // (NotifConfig en 13-config.js), no con un botón flotante acá.
    window.activarNotif = activarNotif;
    window.desactivarNotif = desactivarNotif;
    window.estadoNotif = estadoNotif;
  })();
  </script>
