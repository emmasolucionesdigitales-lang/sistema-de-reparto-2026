<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0f1923"/>
  <title>Sistema de Reparto</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:#080f17;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior:none;}
    input,select,textarea,button{font-family:inherit;}
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
    input[type=number]{-moz-appearance:textfield;}
    #root{min-height:100vh;}
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    // ═══════════════════════════════════════════
    // REEMPLAZÁ ESTOS VALORES CON TU FIREBASE CONFIG
    // ═══════════════════════════════════════════
    const firebaseConfig = {
      apiKey:            "AIzaSyDV1i35MLw74hjnSg6rRZgQFIAI8hsJllI",
      authDomain:        "app-reparto-65035.firebaseapp.com",
      projectId:         "app-reparto-65035",
      storageBucket:     "app-reparto-65035.firebasestorage.app",
      messagingSenderId: "162304851374",
      appId:             "1:162304851374:web:0a60847807c8fe9a7a1c3f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.enablePersistence().catch(()=>{});

    // Funciones de Firestore usadas por la app
    async function cloudSave(uid, datos) {
      await db.collection("users").doc(uid).collection("datos").doc("main").set(datos);
    }
    async function cloudLoad(uid) {
      const doc = await db.collection("users").doc(uid).collection("datos").doc("main").get();
      return doc.exists ? doc.data() : null;
    }
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- ════ JS de la app — en orden ════ -->
  <script type="text/babel" src="js/01-temas.js"></script>
  <script type="text/babel" src="js/02-constantes.js"></script>
  <script type="text/babel" src="js/03-tags.js"></script>
  <script type="text/babel" src="js/04-utils.js"></script>
  <script type="text/babel" src="js/05-portada.js"></script>
  <script type="text/babel" src="js/06-stock.js"></script>
  <script type="text/babel" src="js/07-menu.js"></script>
  <script type="text/babel" src="js/08-clientes.js"></script>
  <script type="text/babel" src="js/09-ventas.js"></script>
  <script type="text/babel" src="js/10-promocion.js"></script>
  <script type="text/babel" src="js/11-gestion.js"></script>
  <script type="text/babel" src="js/12-resumen.js"></script>
  <script type="text/babel" src="js/13-config.js"></script>
  <script type="text/babel" src="js/14-agenda.js"></script>
  <script type="text/babel" src="js/15-app.js"></script>

  <!-- Render -->
  <script type="text/babel">
    const rootEl = document.getElementById("root");
    const root = ReactDOM.createRoot ? ReactDOM.createRoot(rootEl) : null;
    if(root) root.render(<App />);
    else ReactDOM.render(<App />, rootEl);
  </script>
</body>
</html>
