<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0f1923"/>
  <title>Sistema de Reparto</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="favicon.ico" sizes="32x32"/>
  <link rel="icon" href="icono-192.png" sizes="192x192" type="image/png"/>
  <link rel="apple-touch-icon" href="icono-192.png"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:#080f17;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior:none;}
    input,select,textarea,button{font-family:inherit;}
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
    input[type=number]{-moz-appearance:textfield;}
    #root{min-height:100vh;}
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    // ═══════════════════════════════════════════
    // REEMPLAZÁ ESTOS VALORES CON TU FIREBASE CONFIG
    // ═══════════════════════════════════════════
    const firebaseConfig = {
      apiKey:            "AIzaSyDV1i35MLw74hjnSg6rRZgQFIAI8hsJllI",
      authDomain:        "app-reparto-65035.firebaseapp.com",
      projectId:         "app-reparto-65035",
      storageBucket:     "app-reparto-65035.firebasestorage.app",
      messagingSenderId: "162304851374",
      appId:             "1:162304851374:web:0a60847807c8fe9a7a1c3f"
    };
    firebase.initializeApp(firebaseConfig);
    window.db = firebase.firestore();
    window.db.enablePersistence().catch(()=>{});
    const db = window.db;

    // Firebase admin (app-control-de-apps) — verifica códigos de licencia
    firebase.initializeApp({
      apiKey:            "AIzaSyAFQ4ybqIoVV3rWe1FMjMVUZ-qzLNZbdBk",
      authDomain:        "app-control-de-apps.firebaseapp.com",
      projectId:         "app-control-de-apps",
      storageBucket:     "app-control-de-apps.firebasestorage.app",
      messagingSenderId: "761424199819",
      appId:             "1:761424199819:web:513eeaf0e54f4e1401d48e"
    }, "control");
    window.dbLicencias = firebase.app("control").firestore();

    // Verifica el código contra la base del admin y devuelve los datos
    window.verificarLicencia = async function(codigo) {
      try {
        const snap = await window.dbLicencias
          .collection("licencias")
          .doc(codigo.trim().toUpperCase())
          .get();
        if(!snap.exists) return null;
        const d = snap.data();
        if(d.estado !== "activo") return null;
        return d; // incluye: pin, negocio, email, celular, nombre
      } catch(e) { console.error("verificarLicencia:", e); return null; }
    };

    // Funciones de Firestore — fallback a "firebase" si no hay código de licencia
    async function cloudSave(data, id) {
      const safeId = (id && id !== "") ? id : "firebase";
      try {
        await db.collection("users").doc(safeId).collection("datos").doc("main").set(data);
        return true;
      } catch(e) { console.error("cloudSave error:", e); return false; }
    }
    async function cloudLoad(id) {
      const safeId = (id && id !== "") ? id : "firebase";
      try {
        const doc = await db.collection("users").doc(safeId).collection("datos").doc("main").get();
        return doc.exists ? doc.data() : null;
      } catch(e) { console.error("cloudLoad error:", e); return null; }
    }

    // ── Brevo email ─────────────────────────────────────────────────────
    window.enviarEmailBrevoRM = async function({to, toName, subject, htmlContent}) {
      const resp = await fetch("https://api.brevo.com/v3/smtp/email", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "api-key": "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"
        },
        body: JSON.stringify({
          sender: { name: "Sistema de Reparto", email: "carabajalponce1980@gmail.com" },
          to: [{ email: to, name: toName || "" }],
          subject: subject,
          htmlContent: htmlContent
        })
      });
      if(!resp.ok) { const t = await resp.text(); throw new Error("Brevo " + resp.status + ": " + t); }
      return true;
    };
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- ════ JS de la app — en orden ════ -->
  <script type="text/babel" src="js/01-temas.js"></script>
  <script type="text/babel" src="js/02-constantes.js"></script>
  <script type="text/babel" src="js/03-tags.js"></script>
  <script type="text/babel" src="js/04-utils.js"></script>
  <script type="text/babel" src="js/05-portada.js"></script>
  <script type="text/babel" src="js/06-stock.js"></script>
  <script type="text/babel" src="js/07-menu.js"></script>
  <script type="text/babel" src="js/08-clientes.js"></script>
  <script type="text/babel" src="js/09-ventas.js"></script>
  <script type="text/babel" src="js/10-promocion.js"></script>
  <script type="text/babel" src="js/11-gestion.js"></script>
  <script type="text/babel" src="js/12-resumen.js"></script>
  <script type="text/babel" src="js/13-config.js"></script>
  <script type="text/babel" src="js/14-agenda.js"></script>
  <script type="text/babel" src="js/15-app.js"></script>

  <!-- Render -->
  <script type="text/babel">
    const rootEl = document.getElementById("root");
    const root = ReactDOM.createRoot ? ReactDOM.createRoot(rootEl) : null;
    if(root) root.render(<App />);
    else ReactDOM.render(<App />, rootEl);
  </script>
</body>
</html>
