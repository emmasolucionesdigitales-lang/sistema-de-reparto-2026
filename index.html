  <title>Sistema de Reparto</title>
  <script>
    if('serviceWorker' in navigator){
      const CACHE = 'lc-v52';
      const ASSETS = [
        'https://unpkg.com/react@18/umd/react.production.min.js',
        'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
        'https://unpkg.com/@babel/standalone/babel.min.js',
        'https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js',
        'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js',
      ];
      const sw = `
const CACHE='${CACHE}';
const ASSETS=${JSON.stringify(ASSETS)};
self.addEventListener('install',e=>{
  e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()));
});
self.addEventListener('activate',e=>{
  e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>clients.claim()));
});
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET') return;
  e.respondWith(
    caches.match(e.request).then(cached=>{
      const net = fetch(e.request).then(res=>{
        if(res.ok) caches.open(CACHE).then(c=>c.put(e.request,res.clone()));
        return res;
      }).catch(()=>cached);
      return cached||net;
    })
  );
});
self.addEventListener('push',e=>{
  const d=e.data?e.data.json():{};
  e.waitUntil(self.registration.showNotification(d.title||'Notificación',{
    body:d.body||'',tag:d.tag||'default',requireInteraction:!!d.requireInteraction
  }));
});
self.addEventListener('notificationclick',e=>{
  e.notification.close();
  e.waitUntil(clients.matchAll({type:'window'}).then(cs=>{
    if(cs.length>0){cs[0].focus();return;}
    clients.openWindow('/');
  }));
});`;
      const blob = new Blob([sw],{type:'application/javascript'});
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(()=>{});
    }
  </script>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyDV1i35MLw74hjnSg6rRZgQFIAI8hsJllI",
      authDomain: "app-reparto-65035.firebaseapp.com",
      projectId: "app-reparto-65035",
      storageBucket: "app-reparto-65035.firebasestorage.app",
      messagingSenderId: "162304851374",
      appId: "1:162304851374:web:0a60847807c8fe9a7a1c3f"
    };
    try {
      if(!firebase.apps || !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      window.db = firebase.firestore();

      // Firebase licencias — app-control-de-apps (central de licencias)
      var licConfig = {
        apiKey: "AIzaSyAFQ4ybqIoVV3rWe1FMjMVUZ-qzLNZbdBk",
        authDomain: "app-control-de-apps.firebaseapp.com",
        projectId: "app-control-de-apps",
        storageBucket: "app-control-de-apps.firebasestorage.app",
        messagingSenderId: "761424199819",
        appId: "1:761424199819:web:513eeaf0e54f4e1401d48e"
      };
      try {
        var licApp = firebase.apps.find(function(a){return a.name==='licencias';}) || firebase.initializeApp(licConfig,'licencias');
        window.dbLicencias = firebase.firestore(licApp);
      } catch(e){ console.log('Licencias init:',e); }

      // Firebase secundario: Emma Control (para enviar datos de integración)
      var ecConfig = {
        apiKey: "AIzaSyBbLoljOPJgjNvVN7bfOuMl8NrUjFB-agU",
        authDomain: "emma-control.firebaseapp.com",
        projectId: "emma-control",
      };
      try {
        var ecApp = firebase.apps.find(a=>a.name==='emma-control') || firebase.initializeApp(ecConfig,'emma-control');
        window.dbEC = firebase.firestore(ecApp);
      } catch(e){ console.log('EC init:',e); }

      // Función para enviar datos del día a Emma Control
      window.enviarAEmmaControl = function(token, fecha, ingresos, gastos){
        if(!token || !window.dbEC) return;
        var ref = window.dbEC.collection('integraciones').doc(token).collection('movs');
        var batch = window.dbEC.batch();
        // Ingreso del día
        if(ingresos.total > 0){
          var ingId = 'lc_ing_' + fecha.replace(/-/g,'');
          batch.set(ref.doc(ingId), {
            id: ingId,
            tipo: 'ingreso',
            ent: 'negocio',
            desc: 'Reparto del día — ' + fecha,
            monto: ingresos.total,
            efectivo: ingresos.efectivo,
            transferencia: ingresos.transferencia,
            cat: 'App de Reparto',
            fecha: fecha,
            metodo: 'efectivo',
            _origen: 'la_catalina',
            _ts: Date.now(),
          });
        }
        // Gastos del día
        (gastos||[]).forEach(function(g, i){
          if(!g.monto || g.monto <= 0) return;
          var gId = 'lc_gas_' + fecha.replace(/-/g,'') + '_' + i;
          batch.set(ref.doc(gId), {
            id: gId,
            tipo: 'gasto',
            ent: 'negocio',
            desc: g.desc || 'Gasto reparto',
            monto: g.monto,
            cat: g.cat || 'Otros',
            fecha: fecha,
            metodo: g.metodo || 'efectivo',
            _origen: 'la_catalina',
            _ts: Date.now(),
          });
        });
        batch.commit().then(function(){ console.log('✅ Datos enviados a Emma Control'); })
          .catch(function(e){ console.log('Error Emma Control:', e); });
      };
      window.db.enablePersistence({synchronizeTabs:false}).catch(function(err){
        if(err.code==="failed-precondition"||err.code==="unimplemented"){
          console.warn("Offline persistence not available:", err.code);
        }
      });
    } catch(e) { console.error("Firebase init error:", e); window.db = null; }

    function cloudSave(data) {
      if(!window.db) return Promise.resolve(false);
      var col = window.db.collection("lc2");
      var saves = [
        col.doc("config").set({
          planillas: data.planillas || {},
          stock: data.stock || {},
          productos: data.productos || [],
          noVisitas: data.noVisitas || [],
          cargasDia: data.cargasDia || {},
          recordatorios: data.recordatorios || [],
          prospectos: data.prospectos || [],
          mantVeh: data.mantVeh || [],
          histPrecios: data.histPrecios || [],
          zonasReparto: data.zonasReparto || {}
        })
      ];
      // clientes en chunks de 50
      var cl = data.clientes || [];
      var nc = Math.ceil(cl.length/50)||1;
      saves.push(col.doc("clientes_meta").set({n:nc,total:cl.length}));
      for(var i=0;i<nc;i++){
        saves.push(col.doc("cl_"+i).set({d:cl.slice(i*50,i*50+50)}));
      }
      // ventas en chunks de 80
      var vt = data.ventas || [];
      var nv = Math.ceil(vt.length/80)||1;
      saves.push(col.doc("ventas_meta").set({n:nv,total:vt.length}));
      for(var j=0;j<nv;j++){
        saves.push(col.doc("vt_"+j).set({d:vt.slice(j*80,j*80+80)}));
      }
      // prospectos
      var pr = data.prospectos || [];
      saves.push(col.doc("prospectos").set({d:pr}));
      return Promise.all(saves).then(function(){return true;}).catch(function(e){console.error("Save err",e);return false;});
    }

    function cloudLoad() {
      if(!window.db) return Promise.resolve(null);
      var col = window.db.collection("lc2");
      return Promise.all([
        col.doc("config").get(),
        col.doc("clientes_meta").get(),
        col.doc("ventas_meta").get(),
        col.doc("prospectos").get()
      ]).then(function(results) {
        var cfg = results[0]; var cMeta = results[1]; var vMeta = results[2]; var prDoc = results[3];
        if(!cfg.exists) return null;
        var data = cfg.data();
        if(!data.recordatorios) data.recordatorios = [];
        if(!data.prospectos) data.prospectos = [];
        if(!data.mantVeh) data.mantVeh = [];
        if(!data.zonasReparto) data.zonasReparto = {};
        if(!data.histPrecios) data.histPrecios = [];
        // load clientes
        var nc = cMeta.exists ? (cMeta.data().n||0) : 0;
        var vn = vMeta.exists ? (vMeta.data().n||0) : 0;
        var cFetches = [];
        for(var i=0;i<nc;i++) cFetches.push(col.doc("cl_"+i).get());
        var vFetches = [];
        for(var j=0;j<vn;j++) vFetches.push(col.doc("vt_"+j).get());
        return Promise.all(cFetches.concat(vFetches)).then(function(docs) {
          var cDocs = docs.slice(0,nc);
          var vDocs = docs.slice(nc);
          data.clientes = cDocs.reduce(function(a,d){return a.concat(d.exists?d.data().d:[]);}, []);
          data.ventas   = vDocs.reduce(function(a,d){return a.concat(d.exists?d.data().d:[]);}, []);
          data.prospectos = prDoc.exists ? (prDoc.data().d||[]) : [];
          return data;
        });
      }).catch(function(e){console.error("Load err",e);return null;});
    }
  </script>

    try {

  // ── Push Notifications ────────────────────────────────────────────────
  const VAPID_PUB_KEY = '7IE_7ydioqoBHDer9Yw2nryv3ChAt5IlVzFtW7VwdKicxz_8PjO_1vreFZ9xn8CXcm0YzHoD9cIq50jiZEbGxw';
  function urlB64ToUint8(b){
    const p='='.repeat((4-b.length%4)%4);
    const s=(b+p).replace(/-/g,'+').replace(/_/g,'/');
    const r=atob(s); const o=new Uint8Array(r.length);
    for(let i=0;i<r.length;i++) o[i]=r.charCodeAt(i); return o;
  }
  async function guardarSub(sub){
    if(!window.db) return;
    await window.db.collection('lc2').doc('push_sub').set({sub:JSON.stringify(sub)});
  }
  async function activarNotif(){
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){alert('Tu navegador no soporta notificaciones.');return false;}
    const p=await Notification.requestPermission();
    if(p!=='granted') return false;
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(VAPID_PUB_KEY)});
    await guardarSub(sub); return true;
  }
  async function desactivarNotif(){
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub) await sub.unsubscribe();
    if(window.db) await window.db.collection('lc2').doc('push_sub').delete();
  }
  async function estadoNotif(){
    if(!('PushManager' in window)) return false;
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    return !!sub;
  }
  window.addEventListener('load', async ()=>{
    if(!('PushManager' in window)) return;
    const btn=document.createElement('button');
    btn.id='btn-push-notif';
    btn.style.cssText='position:fixed;bottom:80px;right:16px;z-index:9999;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.5);background:#1a2b3c;color:#fff;';
    const upd=async()=>{const a=await estadoNotif();btn.textContent=a?'🔔':'🔕';btn.title=a?'Desactivar notificaciones':'Activar notificaciones';btn.style.opacity=a?'1':'0.5';};
    btn.onclick=async()=>{const a=await estadoNotif();if(a){await desactivarNotif();}else{await activarNotif();}await upd();};
    document.body.appendChild(btn);
    await upd();
  });
  </script>
